# College Study Companion Configuration
discord:
  token: "${DISCORD_BOT_TOKEN}"
  status_message: "Studying College Subjects"

ollama:
  base_url: "http://localhost:11434"
  llm_model: "Spark-X2.5-4b-Q8_0:latest"
  llm_keep_alive: "-1"         # Keep permanently hot in GPU VRAM
  think: false                 # Prefer direct answers for interactive Discord requests
  llm_temperature: 0.2
  llm_num_ctx: 8192            # Context limit for chat and vision requests
  llm_top_p: 0.9
  llm_top_k: 40
  llm_repeat_penalty: 1.05
  llm_max_tokens: 1024         # Bound generation with Ollama num_predict
  router_model: "Arch-Router"
  router_num_gpu: 0            # Offload to CPU (avoids GPU VRAM evictions)
  router_keep_alive: "0"       # Load on demand to leave RAM for the bot and reranker
  router_temperature: 0.0
  router_max_tokens: 10        # Sent to Ollama as num_predict
  embedding_model: "bge-m3"
  embedding_num_gpu: 0         # Offload to CPU (avoids GPU VRAM evictions)
  embedding_keep_alive: "0"    # Release CPU RAM after each embedding batch
  request_timeout: 120.0
  generation_timeout: 90.0    # Overall chat deadline; request_timeout limits idle reads

embeddings:
  vector_size: 1024
  distance: cosine
  batch_size: 10

reranker:
  model_name: "BAAI/bge-reranker-v2-m3"
  top_k: 5
  max_length: 384              # Short overlapping windows reduce CPU reranking cost
  initial_qdrant_candidates: 15
  initial_web_candidates: 8
  score_threshold: 0.0        # Minimum raw reranker score, inclusive
  device: "cpu"
qdrant:
  host: "localhost"
  port: 6333
  grpc_port: 6334
  prefer_grpc: false
  collection_prefix: "subject_"

search:
  max_results: 8

ingestion:
  layout_model: "pp-doclayoutV3"
  ocr_model: "glm-ocr-eot"
  ocr_min_text_chars: 80       # OCR pages below this non-whitespace character count
  ocr_formula_pages: true     # Preserve formula layout on detected math-heavy pages
  ocr_keep_alive: "0"        # Release OCR after each request on the 8 GB GPU
  vision_model: "gemma4_e2b_q8:latest"
  vision_enabled: true
  vision_max_tokens: 1024
  storage_dir: "storage/subjects"
  dpi: 200
  chunk_size: 900             # Target characters (within requested 800-1000 range)
  chunk_overlap: 150
  math_density_threshold: 0.35

web:
  host: "127.0.0.1"
  port: 8000

latex:
  enabled: true
  auto_render: true
  node_executable: "node"
  theme: "light"
  scale: 2.0
  timeout_seconds: 10.0
  max_expression_chars: 2000
  max_expressions_per_answer: 4
  max_width: 2048
  max_height: 1024
  max_pixels: 2097152
  max_png_bytes: 1048576
